short_bio: >-
  <p>
    Hi! I am Savan, a Research Scientist in the Research Group <a href="https://www.thi.de/forschung/institut-fuer-innovative-mobilitaet-iimo/forschungsbereiche/sensorik-und-datenfusion-zur-umfeldwahrnehmung/" target="_blank">Sensor Technology and Data Fusion for Environmental Perception</a> at Technische Hochschule Ingolstadt (THI). Prior to that, I obtained Master of Engineering in International Automotive Engineering from the faculty of Electrical Engineering and Information Technology, <a href="https://www.thi.de/en/" target="_blank">Ingolstadt University of Applied Sciences</a>.  
  </p>
  <p>
    My research focuses on computer vision and artificial intelligence, and their application in mobile robotics and intelligent infrastructure.
  </p>
  <p style="color: #ff170f;">
    I am open to collaboration opportunities in 3D vision, VLM/VLA, Open-world/open-vocabulary scene understanding, and would love to explore potential synergies.
  </p>

